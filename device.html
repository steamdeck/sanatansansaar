<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Sanatan App</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: Arial, sans-serif;
    perspective: 1px; /* needed for 3D rotation */
  }

  /* Rotating bird spinner */
  .spinner {
    width: 200px;
    height: 200px;
    margin: 20px 0;
  }

  .spinner img {
    width: 100%;
    height: auto;
    transform-style: preserve-3d;
    animation: spinY 2s linear infinite; /* continuous rotation */
  }

  @keyframes spinY {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
</style>
<script>
function openAppOrRedirect() {
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
    const isAndroid = /android/i.test(userAgent);
    const isDesktop = !isIOS && !isAndroid;

    if (isDesktop) {
        // Redirect desktop users to website
        window.location.href = "https://www.sanatansansaar.com/";
        return;
    }

    let appURL = "";
    let storeURL = "";

    if (isIOS) {
        appURL = "sanatan://home";
        storeURL = "https://apps.apple.com/in/app/sanatan-sansaar/id6708234349";
    } else if (isAndroid) {
        appURL = "intent://home#Intent;scheme=sanatan;package=com.sanatan.sansaar;end";
        storeURL = "https://play.google.com/store/apps/details?id=com.sanatan.sansaar";
    }

    const startTime = Date.now();
    window.location.href = appURL;

    setTimeout(() => {
        if (Date.now() - startTime < 2000) {
            window.location.href = storeURL;
        }
    }, 1500);
}
</script>
</head>
<body onload="openAppOrRedirect()">
  <!-- Rotating Bird Loader -->
  <div class="spinner">
    <img src="https://www.sanatansansaar.com/Bird.png" alt="Bird Loader">
  </div>
</body>
</html>
