<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Sanatan App</title>
<style>
  .ss-app-qr-row { display: flex; gap: 20px; margin-top: 20px; }
  .ss-app-qr-card { text-align: center; text-decoration: none; color: inherit; }
  .ss-qr-img { width: 200px; height: 200px; }
  .ss-app-label { display: block; margin-top: 5px; font-weight: bold; }
  #open-app-btn { padding: 15px 30px; font-size: 16px; margin-top: 20px; cursor: pointer; }
</style>
<script>
function openAppOrRedirect() {
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
    const isAndroid = /android/i.test(userAgent);
    const isDesktop = !isIOS && !isAndroid;

    if (isDesktop) {
        // Show QR codes for desktop users
        document.getElementById('qr-section').style.display = 'flex';
        document.getElementById('open-app-btn').style.display = 'none';
        return;
    }

    // Show Open App button for mobile
    document.getElementById('open-app-btn').style.display = 'inline-block';
    document.getElementById('open-app-btn').onclick = () => {
        let appURL = "";  // Custom URL scheme (replace with your app's if available)
        let storeURL = "";

        if (isIOS) {
            appURL = "sanatan://home"; // Replace with your iOS custom URL scheme if available
            storeURL = "https://linktw.in/VtYmEs";
        } else if (isAndroid) {
            appURL = "intent://home#Intent;scheme=sanatan;package=com.sanatan.sansaar;end"; // Replace if needed
            storeURL = "https://linktw.in/gAvZVN";
        }

        const startTime = Date.now();
        window.location.href = appURL;

        setTimeout(() => {
            if (Date.now() - startTime < 2000) {
                // App not installed, redirect to store
                window.location.href = storeURL;
            }
        }, 1500);
    };
}
</script>
</head>
<body onload="openAppOrRedirect()">

<p>Open the Sanatan Sansaar app or scan the QR code if on desktop.</p>

<!-- Open App button for mobile -->
<button id="open-app-btn" style="display:none;">Open App</button>

<!-- QR Codes for desktop users -->
<div id="qr-section" class="ss-app-qr-row" style="display:none;">
    <a href="https://linktw.in/gAvZVN" target="_blank" rel="noopener noreferrer" class="ss-app-qr-card">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://linktw.in/gAvZVN"
           alt="Android QR" class="ss-qr-img" loading="lazy">
      <span class="ss-app-label">Android</span>
    </a>
    <a href="https://linktw.in/VtYmEs" target="_blank" rel="noopener noreferrer" class="ss-app-qr-card">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://linktw.in/VtYmEs"
           alt="iOS QR" class="ss-qr-img" loading="lazy">
      <span class="ss-app-label">iOS</span>
    </a>
</div>

</body>
</html>
