<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    function detectAndRedirect() {
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;

      if (/android/i.test(userAgent)) {
        // Android device
        window.location.href = "https://play.google.com/store/apps/details?id=com.sanatan.sansaar.astro";
      } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        // iOS device
        window.location.href = "https://apps.apple.com/in/app/sanatan-sansaar-astro/id6757469380";
      } else {
        // Fallback (optional)
        document.body.innerHTML = "<h2>Please open this link on your mobile device.</h2>";
      }
    }
  </script>
</head>
<body onload="detectAndRedirect()">
</body>
</html>
