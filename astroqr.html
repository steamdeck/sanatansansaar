<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanatan Sansaar Astro - Opening App...</title>

    <!-- Open Graph -->
    <meta property="og:title" content="Sanatan Sansaar Astro">
    <meta property="og:description" content="Your spiritual companion for astrology, pooja, and more!">
    <meta property="og:image" content="https://www.sanatansansaar.com/Bird.png">
    <meta property="og:url" content="https://www.sanatansansaar.com">
    <meta property="og:type" content="website">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            min-height: 100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:20px;
            color:white;
        }

        .container { text-align:center; max-width:400px; }

        .logo {
            width:120px;
            height:120px;
            border-radius:24px;
            margin-bottom:24px;
        }

        h1 { font-size:28px; margin-bottom:12px; }
        .subtitle { margin-bottom:32px; opacity:.9; }

        .spinner {
            width:24px;
            height:24px;
            border:3px solid rgba(255,255,255,0.3);
            border-top:white;
            border-radius:50%;
            animation:spin 1s linear infinite;
        }

        @keyframes spin { to { transform:rotate(360deg); } }

        .loading {
            display:flex;
            gap:10px;
            justify-content:center;
            align-items:center;
            margin-bottom:24px;
        }

        .btn {
            display:block;
            padding:14px;
            border-radius:12px;
            text-decoration:none;
            font-weight:600;
            margin:10px 0;
        }

        .primary { background:white; color:#FF6B35; }
        .secondary { border:2px solid white; color:white; }

        .hidden { display:none; }
    </style>
</head>

<body>

<div class="container">

    <img src="https://www.sanatansansaar.com/Bird.png" class="logo">

    <h1>Sanatan Sansaar Astro</h1>
    <p class="subtitle">Opening app...</p>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <span>Opening app...</span>
    </div>

    <div id="buttons" class="hidden">
        <a href="#" id="openAppBtn" class="btn primary">Open App</a>
        <a href="#" id="storeBtn" class="btn secondary">Download App</a>
    </div>

</div>

<script>
// ================= CONFIG =================
const CONFIG = {
    appScheme: 'sanatansansaar',
    packageName: 'com.sanatan.sansaar.astro',

    playStoreNativeUrl: 'market://details?id=com.sanatan.sansaar.astro',
    playStoreWebUrl: 'https://play.google.com/store/apps/details?id=com.sanatan.sansaar.astro',

    fallbackUrl: 'https://www.sanatansansaar.com'
};

// ================= DETECTION =================
const userAgent = navigator.userAgent || navigator.vendor || window.opera;

const isAndroid = /android/i.test(userAgent);
const isIOS = /iphone|ipad|ipod/i.test(userAgent);
const isMobile = isAndroid || isIOS;

const isChromeAndroid = isAndroid && /Chrome\/[.0-9]*/i.test(userAgent);

const isInAppBrowser = (
    /FBAN|FBAV/i.test(userAgent) ||
    /Instagram/i.test(userAgent) ||
    /Twitter/i.test(userAgent) ||
    /LinkedInApp/i.test(userAgent) ||
    /Line\//i.test(userAgent) ||
    /KAKAOTALK/i.test(userAgent) ||
    /Snapchat/i.test(userAgent) ||
    /WhatsApp/i.test(userAgent) ||
    /Telegram/i.test(userAgent) ||
    /Discord/i.test(userAgent) ||
    (isAndroid && /wv\)/i.test(userAgent))
);

// ================= PATH =================
const currentPath = window.location.pathname || '/';
const currentSearch = window.location.search || '';

// ================= BUILD APP LINK (FIXED SAFE) =================
function buildAppLink() {
    let appPath = currentPath;

    if (appPath.startsWith('/app')) {
        appPath = appPath.substring(4) || '/';
    }

    // ✅ Ensure valid path (CRITICAL FIX)
    if (!appPath || appPath === '') {
        appPath = '/';
    }

    if (!appPath.startsWith('/')) {
        appPath = '/' + appPath;
    }

    const customSchemeUrl = `${CONFIG.appScheme}:/${appPath}${currentSearch}`;

    if (isChromeAndroid && !isInAppBrowser) {
        return `intent://${appPath}${currentSearch}#Intent;scheme=${CONFIG.appScheme};package=${CONFIG.packageName};end`;
    }

    return customSchemeUrl;
}

// ================= STORE =================
function openStore() {
    if (isInAppBrowser) {
        window.location.href = CONFIG.playStoreWebUrl;
        return;
    }

    window.location.href = CONFIG.playStoreNativeUrl;

    setTimeout(() => {
        window.location.href = CONFIG.playStoreWebUrl;
    }, 1200);
}

// ================= FLOW =================
function tryOpenApp() {
    if (!isMobile || isInAppBrowser) {
        showButtons();
        return;
    }

    const start = Date.now();
    const appLink = buildAppLink();

    window.location.href = appLink;

    setTimeout(() => {
        const elapsed = Date.now() - start;

        if (elapsed < 2000) {
            showButtons();
            openStore();
        }
    }, 1500);
}

// ================= UI =================
function showButtons() {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('buttons').classList.remove('hidden');
}

// ================= EVENTS =================
document.getElementById('openAppBtn').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = buildAppLink();
});

document.getElementById('storeBtn').addEventListener('click', (e) => {
    e.preventDefault();
    openStore();
});

// ================= INIT =================
setTimeout(tryOpenApp, 500);
</script>

</body>
</html>
